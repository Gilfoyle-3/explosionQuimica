<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explosión Química - Concurso</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="app">
    <h1>EXPLOSIÓN QUÍMICA 💥</h1>

    <!-- PANTALLA INICIAL: CREAR / UNIRSE -->
    <div id="seccion-login" class="panel">
      <div class="bloque-anfitrion">
        <h3>Panel del Anfitrión</h3>
        <label for="num-elementos">Cantidad de Elementos Químicos:</label>
        <select id="num-elementos">
          <option value="4">4 Elementos (12 cartas + poderes)</option>
          <option value="6">6 Elementos (18 cartas + poderes)</option>
          <option value="8" selected>8 Elementos (24 cartas + poderes)</option>
          <option value="10">10 Elementos (30 cartas + poderes)</option>
          <option value="12">12 Elementos (36 cartas + poderes)</option>
        </select>
        <button id="btn-crear-sala">Crear Concurso</button>
      </div>

      <hr>

      <div class="bloque-jugador">
        <h3>Unirse como Concursante</h3>
        <input type="text" id="input-nickname" placeholder="Tu Apodo / Nombre" maxlength="15">
        <input type="text" id="input-codigo" placeholder="Código de Sala">
        <button id="btn-unirse">Entrar al Concurso</button>
      </div>

      <p id="mensaje-error" class="error"></p>
    </div>

    <!-- SALA DE ESPERA (LOBBY) -->
    <div id="seccion-lobby" class="panel hidden">
      <h2>SALA DE ESPERA</h2>
      <p>Código de la Sala: <strong id="lobby-codigo-display">------</strong></p>

      <div class="lista-jugadores-contenedor">
        <h3>Concursantes Conectados:</h3>
        <ul id="lista-jugadores"></ul>
      </div>

      <!-- Solo visible para el anfitrión -->
      <div id="panel-anfitrion-controles" class="hidden">
        <button id="btn-iniciar-concurso" class="btn-destacado">🚀 ¡INICIAR CONCURSO AHÓRA!</button>
      </div>
      <p id="esperando-mensaje" class="info-espera">Esperando a que el anfitrión inicie la partida...</p>
    </div>

    <!-- PANTALLA DEL JUEGO -->
    <div id="seccion-juego" class="panel hidden">
      <div class="header-juego">
        <div>Código: <span id="juego-codigo-display"></span></div>
        <div id="leaderboard"></div>
      </div>

      <div id="tablero-cartas" class="grid-tablero"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
