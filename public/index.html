<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Química Pro Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="glass-panel">
  <!-- BANNER EVENTOS -->
  <div id="banner-evento" class="event-banner oculto"></div>

  <!-- VISTA 1: CONFIGURACIÓN E INGRESO -->
  <div id="vista-inicio">
    <h1>⚛️ Química Pro Engine</h1>
    <div class="grid-container">
      <div>
        <h2>Crear Sala</h2>
        <button class="btn" onclick="crearSala()">✨ Crear Concurso</button>
      </div>
      <div>
        <h2>Unirse a Juego</h2>
        <div class="input-group">
          <label>Código de Sala</label>
          <input type="text" id="input-codigo" placeholder="Ej: 549210">
        </div>
        <div class="input-group">
          <label>Tu Apodo</label>
          <input type="text" id="input-nickname" placeholder="Ej: ProfeQuimico">
        </div>
        <button class="btn btn-green" onclick="unirseSala()">🚀 Entrar a Sala</button>
      </div>
    </div>
  </div>

  <!-- VISTA 2: LOBBY DE ESPERA -->
  <div id="vista-lobby" class="oculto">
    <h2>Sala: <span id="lbl-codigo" class="text-neon">------</span></h2>
    <p class="subtitle">Comparte el código con tus alumnos o participantes</p>

    <div class="grid-container">
      <div id="panel-configuracion">
        <h3>⚙️ Ajustes del Juego</h3>
        <div class="input-group">
          <label>Nombre del Concurso</label>
          <input type="text" id="cfg-nombre" value="Gran Torneo Química">
        </div>
        <div class="input-group">
          <label>Duración (Segundos)</label>
          <input type="number" id="cfg-tiempo" value="120">
        </div>
        <div class="input-group">
          <label>Cantidad de Elementos (Tríos)</label>
          <select id="cfg-elementos">
            <option value="4">4 Elementos (12 Cartas)</option>
            <option value="8" selected>8 Elementos (24 Cartas)</option>
            <option value="12">12 Elementos (36 Cartas)</option>
          </select>
        </div>
        <div class="input-group">
          <label class="checkbox-item">
            <input type="checkbox" id="cfg-poderes" checked> ⚡ Incluir Cartas de Poder (Bomba, Tornado, etc.)
          </label>
        </div>
        <div class="input-group">
          <label>Familias Permitidas</label>
          <div id="lista-familias" class="checkbox-grid"></div>
        </div>
        <button class="btn" id="btn-iniciar" onclick="iniciarConcurso()">🔥 Comenzar Concurso</button>
      </div>

      <div>
        <h3>👥 Jugadores en Sala</h3>
        <div id="lista-jugadores"></div>
      </div>
    </div>
  </div>

  <!-- VISTA 3: TABLERO INTERACTIVO -->
  <div id="vista-juego" class="oculto">
    <div class="header-juego">
      <h2 id="txt-titulo-concurso">Química Pro</h2>
      <h3 class="text-pink">⏱️ <span id="txt-cronometro">120</span>s</h3>
    </div>
    
    <div class="grid-container grid-juego">
      <div id="tablero-cartas" class="board-grid"></div>
      <div>
        <h3>🏆 Marcador Live</h3>
        <div id="tabla-puntuaciones"></div>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
