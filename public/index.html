<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chem Clash - Quiz Arena</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    
    <!-- PANTALLA PRINCIPAL DE INICIO -->
    <div id="pantalla-inicio" class="seccion activa">
      <h1>CHEM CLASH</h1>
      <div class="panel">
        <input type="text" id="nombreJugador" placeholder="Ingresa tu Alias Gamer">
        <input type="text" id="codigoIngreso" placeholder="Código de Sala (6 dígitos)">
        <button class="btn-iniciar" onclick="unirseConcurso()">Unirse a Partida</button>
      </div>
      
      <div class="panel">
        <button class="btn-secundario" onclick="mostrarSeccion('pantalla-crear')">Crear Sala de Concurso</button>
      </div>
    </div>

    <!-- PANTALLA CONFIGURACIÓN HOST -->
    <div id="pantalla-crear" class="seccion">
      <h2>CREAR SALA</h2>
      <div class="panel">
        <input type="text" id="nombreConcurso" placeholder="Nombre del Torneo">
        <input type="number" id="tiempoConcurso" placeholder="Tiempo en Segundos (ej: 60)" value="60">
        <button onclick="crearConcurso()">Generar Código</button>
        <button class="btn-secundario" onclick="mostrarSeccion('pantalla-inicio')">Volver</button>
      </div>
    </div>

    <!-- LOBBY DEL HOST -->
    <div id="pantalla-sala-host" class="seccion">
      <h2>CÓDIGO DE SALA</h2>
      <div id="codigo-display">------</div>
      <div class="panel">
        <div style="text-align:center; font-weight:800; color:var(--neon-cyan)">JUGADORES EN ESPERA:</div>
        <div id="lista-jugadores-host"></div>
        <button class="btn-iniciar" onclick="iniciarConcurso()">Iniciar Partida</button>
      </div>
    </div>

    <!-- PANTALLA DE JUEGO JUGADOR -->
    <div id="pantalla-juego" class="seccion">
      <div style="display:flex; justify-content:space-between; align-items:center; font-weight:900;">
        <span style="color:var(--neon-cyan)">PUNTOS: <span id="mis-puntos">0</span></span>
        <span style="color:var(--neon-gold)" id="cronometro-jugador">60s</span>
      </div>
      <div id="tablero"></div>
    </div>

    <!-- LEADERBOARD / RANKING ESPORTS -->
    <div id="pantalla-ranking" class="seccion">
      <h2 id="titulo-ranking">LEADERBOARD</h2>
      <div style="text-align:center; font-weight:900; color:var(--neon-gold)">TIEMPO RESTANTE: <span id="cronometro-host">60</span>s</div>
      <div id="tabla-ranking"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
